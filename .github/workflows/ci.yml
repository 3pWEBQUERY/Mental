# Prüft jeden Pull Request und jeden Push auf main: Typen, Unit-Tests, Build (auch ohne erreichbare Datenbank –
# so baut Railway) und die E2E-Suite gegen ein echtes Postgres.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nur für die Tests – keine echten Geheimnisse.
  SESSION_SECRET: ci-only-session-secret-not-for-production-0123456789
  APP_URL: http://localhost:3100
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Typen, Unit-Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Railway baut ohne Datenbank: Seiten mit Fallback müssen trotzdem vorrendern.
      - name: Build ohne Datenbank
        run: npm run build
        env:
          DATABASE_URL: postgres://lichtung:x@127.0.0.1:1/lichtung
      - name: Abhängigkeiten auf bekannte Lücken prüfen
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lichtung
          POSTGRES_PASSWORD: lichtung
          POSTGRES_DB: lichtung
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lichtung"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lichtung:lichtung@localhost:5432/lichtung
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Spuren fehlgeschlagener Tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
